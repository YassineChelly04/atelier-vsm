[package]
name = "atelier-vsm"
version = "0.1.0"
description = "Atelier VSM : cartographie de la chaîne de valeur avec calculs Lean en direct"
authors = ["Atelier VSM"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "atelier_vsm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "debuginfo"
